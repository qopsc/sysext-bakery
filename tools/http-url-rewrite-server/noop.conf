# A transfer that never matches anything. systemd-sysupdate refuses to run ("No transfer definitions
# found.") when /etc/sysupdate.d holds no definitions, which is the normal case when every extension
# lives in its own /etc/sysupdate.<name>.d. Install this as /etc/sysupdate.d/noop.conf.
# Served as https://extensions.quantumops.consulting/extensions/noop.conf from the `noop` release.
[Source]
Type=regular-file
Path=/
MatchPattern=invalid@v.raw

[Target]
Type=regular-file
Path=/
MatchPattern=invalid@v.raw
