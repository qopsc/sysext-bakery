name: Check for new / missing upstream releases and dispatch builds

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch to build'
        type: string
        required: false
        default: 'main'
  schedule:
    # Each day at 5am UTC
    - cron:  '0 5 * * *'

jobs:
  list-builds:
    runs-on: namespace-profile-linux-amd64-4c-8g-u24
    outputs:
      builds: ${{ steps.list.outputs.builds }}
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail

          sudo apt update -qq && sudo apt install -yqq \
            curl \
            jq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: list
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pushd bakery
          ./release_dispatcher.sh

  # qopsc fork (patch #23): one native leg per architecture on Namespace
  # runners instead of a single QEMU job building both arches.
  build:
    needs: list-builds
    if: ${{ needs.list-builds.outputs.builds != '[]' && needs.list-builds.outputs.builds != '' }}
    strategy:
      # qopsc fork: without this, one failing extension cancels its siblings
      # mid-build, so a single bad build wastes the whole matrix.
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.list-builds.outputs.builds) }}
        arch: [x86-64, arm64]
    # Try to finish all jobs even if one fails.
    # Job fails can be transient and will be re-tried every time this action runs.
    continue-on-error: true

    runs-on: ${{ matrix.arch == 'arm64' && 'namespace-profile-linux-arm64-4c-8g-u24' || 'namespace-profile-linux-amd64-4c-8g-u24' }}
    steps:
      - name: Check out the bakery repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail

          sudo apt update -qq && sudo apt install -yqq \
            curl \
            jq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: build one architecture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SPEC: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          pushd bakery
          ./release.sh "${RELEASE_SPEC}" --arch "${ARCH}"

      - name: compute artefact name
        id: artefact
        env:
          RELEASE_SPEC: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          extension="${RELEASE_SPEC%%:*}"
          version="${RELEASE_SPEC#*:}"
          echo "name=${extension}-${version}-${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "base=${extension}-${version}" >> "${GITHUB_OUTPUT}"

      - name: stage build artefacts (Namespace)
        uses: namespace-actions/upload-artifact@v1
        with:
          name: ${{ steps.artefact.outputs.name }}
          path: |
            bakery/${{ steps.artefact.outputs.base }}-${{ matrix.arch }}.raw
            bakery/${{ steps.artefact.outputs.base }}-${{ matrix.arch }}-build.log
            bakery/SHA256SUMS.${{ matrix.arch }}
            bakery/*.conf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # qopsc fork (patch #23): join both architectures, tag once, and create
  # the GitHub release. Releases remain the distribution.
  publish-release:
    needs: [ list-builds, build ]
    if: ${{ needs.list-builds.outputs.builds != '[]' && needs.list-builds.outputs.builds != '' }}
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.list-builds.outputs.builds) }}
    # Same rationale as build: a failed publish must not skip the metadata
    # jobs, which 'need' this one.
    continue-on-error: true
    runs-on: namespace-profile-linux-amd64-4c-8g-u24
    permissions:
      # allow the action to create a release
      contents: write
    steps:
      - name: Check out the bakery repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: compute artefact base name
        id: artefact
        env:
          RELEASE_SPEC: ${{ matrix.release }}
        run: |
          set -euxo pipefail
          extension="${RELEASE_SPEC%%:*}"
          version="${RELEASE_SPEC#*:}"
          echo "base=${extension}-${version}" >> "${GITHUB_OUTPUT}"

      - name: download both architecture artefacts
        uses: namespace-actions/download-artifact@v2
        with:
          pattern: ${{ steps.artefact.outputs.base }}-*
          path: staging
          merge-multiple: false

      - name: join arches and tag
        id: build
        env:
          RELEASE_SPEC: ${{ matrix.release }}
          BASE: ${{ steps.artefact.outputs.base }}
        run: |
          set -euxo pipefail
          cp "staging/${BASE}-x86-64/"* bakery/
          cp "staging/${BASE}-arm64/${BASE}-arm64.raw" bakery/
          cp "staging/${BASE}-arm64/${BASE}-arm64-build.log" bakery/
          cp "staging/${BASE}-arm64/SHA256SUMS.arm64" bakery/
          pushd bakery
          ./release.sh "${RELEASE_SPEC}" --join

      - name: create a new release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          tag_name: ${{ steps.build.outputs.tag }}
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
            bakery/*.raw
            bakery/*.conf
            bakery/*-build.log

  update-extension-metadata:
    needs: [ list-builds, publish-release ]
    if: ${{ needs.list-builds.outputs.extensions != '[]' && needs.list-builds.outputs.extensions != '' }}
    strategy:
      # qopsc fork: one extension's metadata failure must not cancel the other
      # legs of this matrix.
      fail-fast: false
      matrix:
        extension: ${{ fromJson(needs.list-builds.outputs.extensions) }}
    # qopsc fork: same rationale as publish-release above -- a failed leg must
    # not skip update-global-metadata, which 'needs' this job. Publishing a
    # global SHA256SUMS missing one extension beats publishing none at all.
    continue-on-error: true
    runs-on: namespace-profile-linux-amd64-4c-8g-u24
    permissions:
      # allow the action to create a release
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail

          sudo apt update -qq && sudo apt install -yqq \
            curl \
            jq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: Fetch extension release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pushd bakery
          ./release_meta.sh ${{ matrix.extension }}

      - name: create new metadata release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          tag_name: ${{ matrix.extension }}
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
            bakery/*.conf

  update-global-metadata:
    # qopsc fork: 'list-builds' must be in 'needs' for the condition below to
    # see it. Without it, needs.list-builds.outputs.extensions evaluates to
    # null, the '!= ''' test is false, and this job is skipped on every run --
    # which is why the global SHA256SUMS release was never published.
    needs: [ list-builds, update-extension-metadata ]
    if: ${{ needs.list-builds.outputs.extensions != '[]' && needs.list-builds.outputs.extensions != '' }}
    runs-on: namespace-profile-linux-amd64-4c-8g-u24
    permissions:
      # allow the action to create a release
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail

          sudo apt update -qq && sudo apt install -yqq \
            curl \
            jq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: Fetch all extension releases metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pushd bakery
          ./release_meta.sh

      - name: create new metadata release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: SHA256SUMS
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
