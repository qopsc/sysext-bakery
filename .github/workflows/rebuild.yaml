name: Rebuild a published sysext release

# qopsc fork: the daily release.yaml only builds versions that have no GitHub
# release yet. Use this workflow to remake an existing version after a bake
# script or bundled unit change (e.g. arcane v2.9.0 after the agent-unit
# env-default patch).
#
# qopsc fork (patch #23): builds run natively per architecture on Namespace
# runners. Each arch leg stages its .raw/log/partial sums as a Namespace
# artefact; the publish job joins both arches, tags, and recreates the
# GitHub release. GitHub Releases remain the distribution (see
# 2026-10-16-namespace-migration-design.md).
on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Sysext to rebuild (e.g. arcane). Required unless "releases" is set.'
        type: string
        required: false
      version:
        description: 'Version as bakery.sh list reports it (e.g. v2.9.0 or latest). Required unless "releases" is set.'
        type: string
        required: false
      releases:
        description: 'Optional comma-separated extension:version list (e.g. "arcane:v2.9.0,dust:v1.2.5"). Overrides extension+version.'
        type: string
        required: false
      branch:
        description: 'Branch to build from'
        type: string
        required: false
        default: 'main'

# Least privilege at workflow scope; jobs that publish override to write.
permissions:
  contents: read

jobs:
  list-rebuilds:
    runs-on: namespace-profile-linux-amd64-4c-8g-u24
    outputs:
      builds: ${{ steps.list.outputs.builds }}
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq \
            curl \
            jq

      - name: list
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
          RELEASES: ${{ inputs.releases }}
        run: |
          pushd bakery
          ./rebuild_dispatcher.sh

  build:
    needs: list-rebuilds
    if: ${{ needs.list-rebuilds.outputs.builds != '[]' && needs.list-rebuilds.outputs.builds != '' }}
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.list-rebuilds.outputs.builds) }}
        arch: [x86-64, arm64]
    continue-on-error: false
    runs-on: ${{ matrix.arch == 'arm64' && 'namespace-profile-linux-arm64-4c-8g-u24' || 'namespace-profile-linux-amd64-4c-8g-u24' }}
    steps:
      - name: Check out the bakery repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq \
            curl \
            jq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: build one architecture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SPEC: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          pushd bakery
          ./release.sh "${RELEASE_SPEC}" --arch "${ARCH}"

      - name: compute artefact name
        id: artefact
        env:
          RELEASE_SPEC: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          extension="${RELEASE_SPEC%%:*}"
          version="${RELEASE_SPEC#*:}"
          echo "name=${extension}-${version}-${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "base=${extension}-${version}" >> "${GITHUB_OUTPUT}"

      - name: stage build artefacts (Namespace)
        uses: namespace-actions/upload-artifact@v1
        with:
          name: ${{ steps.artefact.outputs.name }}
          path: |
            bakery/${{ steps.artefact.outputs.base }}-${{ matrix.arch }}.raw
            bakery/${{ steps.artefact.outputs.base }}-${{ matrix.arch }}-build.log
            bakery/SHA256SUMS.${{ matrix.arch }}
            bakery/*.conf
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish-release:
    needs: [list-rebuilds, build]
    if: ${{ needs.list-rebuilds.outputs.builds != '[]' && needs.list-rebuilds.outputs.builds != '' }}
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.list-rebuilds.outputs.builds) }}
    runs-on: namespace-profile-linux-amd64-4c-8g-u24
    permissions:
      contents: write
    steps:
      - name: Check out the bakery repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: compute artefact base name
        id: artefact
        env:
          RELEASE_SPEC: ${{ matrix.release }}
        run: |
          set -euxo pipefail
          extension="${RELEASE_SPEC%%:*}"
          version="${RELEASE_SPEC#*:}"
          echo "base=${extension}-${version}" >> "${GITHUB_OUTPUT}"
          echo "extension=${extension}" >> "${GITHUB_OUTPUT}"

      - name: download both architecture artefacts
        uses: namespace-actions/download-artifact@v2
        with:
          pattern: ${{ steps.artefact.outputs.base }}-*
          path: staging
          merge-multiple: false

      - name: join arches and tag
        id: build
        env:
          RELEASE_SPEC: ${{ matrix.release }}
          BASE: ${{ steps.artefact.outputs.base }}
        run: |
          set -euxo pipefail
          cp "staging/${BASE}-x86-64/"* bakery/
          cp "staging/${BASE}-arm64/${BASE}-arm64.raw" bakery/
          cp "staging/${BASE}-arm64/${BASE}-arm64-build.log" bakery/
          cp "staging/${BASE}-arm64/SHA256SUMS.arm64" bakery/
          pushd bakery
          ./release.sh "${RELEASE_SPEC}" --join

      - name: delete existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SPEC: ${{ matrix.release }}
        run: |
          set -euxo pipefail
          spec="${RELEASE_SPEC}"
          tag="${spec%%:*}-${spec#*:}"
          # Both arch builds and the join succeeded. Keep the git tag;
          # release.sh --join already force-updated it.
          gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes \
            || echo "No existing '${tag}' release to delete."

      - name: create a new release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          tag_name: ${{ steps.build.outputs.tag }}
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
            bakery/*.raw
            bakery/*.conf
            bakery/*-build.log

  update-extension-metadata:
    needs: [list-rebuilds, publish-release]
    if: ${{ needs.list-rebuilds.outputs.extensions != '[]' && needs.list-rebuilds.outputs.extensions != '' }}
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJson(needs.list-rebuilds.outputs.extensions) }}
    continue-on-error: true
    runs-on: namespace-profile-linux-amd64-4c-8g-u24
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq \
            curl \
            jq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: Fetch extension release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euxo pipefail
          pushd bakery
          ./release_meta.sh "${EXTENSION}"

      - name: create new metadata release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          tag_name: ${{ matrix.extension }}
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
            bakery/*.conf

  update-global-metadata:
    needs: [list-rebuilds, update-extension-metadata]
    if: ${{ needs.list-rebuilds.outputs.extensions != '[]' && needs.list-rebuilds.outputs.extensions != '' }}
    runs-on: namespace-profile-linux-amd64-4c-8g-u24
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq \
            curl \
            jq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: Fetch all extension releases metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pushd bakery
          ./release_meta.sh

      - name: create new metadata release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: SHA256SUMS
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
