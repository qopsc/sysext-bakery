name: Rebuild a published sysext release

# qopsc fork: the daily release.yaml only builds versions that have no GitHub
# release yet. Use this workflow to remake an existing version after a bake
# script or bundled unit change (e.g. arcane v2.9.0 after the agent-unit
# env-default patch).
#
# qopsc fork (patch #23): every job runs on the self-hosted amd64 runner;
# arm64 legs build under QEMU user emulation. Each arch leg stages its
# .raw/log/partial sums in a host directory; the publish job joins both
# arches, tags, and recreates the GitHub release. GitHub Releases remain the
# distribution (see 2026-10-16-namespace-migration-design.md).
on:
  workflow_dispatch:
    inputs:
      extension:
        description: 'Sysext to rebuild (e.g. arcane). Required unless "releases" is set.'
        type: string
        required: false
      version:
        description: 'Version as bakery.sh list reports it (e.g. v2.9.0 or latest). Required unless "releases" is set.'
        type: string
        required: false
      releases:
        description: 'Optional comma-separated extension:version list (e.g. "arcane:v2.9.0,dust:v1.2.5"). Overrides extension+version.'
        type: string
        required: false
      branch:
        description: 'Branch to build from'
        type: string
        required: false
        default: 'main'

# Least privilege at workflow scope; jobs that publish override to write.
permissions:
  contents: read

env:
  SYSEXT_STAGING_ROOT: /var/lib/sysext-ci

jobs:
  list-rebuilds:
    runs-on: [self-hosted, linux, x64]
    outputs:
      builds: ${{ steps.list.outputs.builds }}
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq \
            bzip2 \
            curl \
            gh \
            jq \
            unzip \
            yq

      - name: list
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
          RELEASES: ${{ inputs.releases }}
        run: |
          pushd bakery
          ./rebuild_dispatcher.sh

      - name: prune stale staging directories
        run: |
          set -euxo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" "${SYSEXT_STAGING_ROOT}"
          find "${SYSEXT_STAGING_ROOT}" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} +

  build:
    needs: list-rebuilds
    if: ${{ needs.list-rebuilds.outputs.builds != '[]' && needs.list-rebuilds.outputs.builds != '' }}
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.list-rebuilds.outputs.builds) }}
        arch: [x86-64, arm64]
    continue-on-error: false
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out the bakery repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq \
            bzip2 \
            curl \
            gh \
            jq \
            unzip \
            yq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: register arm64 QEMU binfmt handler
        if: ${{ matrix.arch == 'arm64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: build one architecture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SPEC: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          pushd bakery
          ./release.sh "${RELEASE_SPEC}" --arch "${ARCH}"

      - name: compute artefact name
        id: artefact
        env:
          RELEASE_SPEC: ${{ matrix.release }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          extension="${RELEASE_SPEC%%:*}"
          version="${RELEASE_SPEC#*:}"
          echo "name=${extension}-${version}-${ARCH}" >> "${GITHUB_OUTPUT}"
          echo "base=${extension}-${version}" >> "${GITHUB_OUTPUT}"

      - name: stage build artefacts (host directory)
        env:
          NAME: ${{ steps.artefact.outputs.name }}
          BASE: ${{ steps.artefact.outputs.base }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" "${SYSEXT_STAGING_ROOT}"
          dest="${SYSEXT_STAGING_ROOT}/${GITHUB_RUN_ID}/${NAME}"
          rm -rf "${dest}"
          mkdir -p "${dest}"
          cp "bakery/${BASE}-${ARCH}.raw" \
             "bakery/${BASE}-${ARCH}-build.log" \
             "bakery/SHA256SUMS.${ARCH}" \
             bakery/*.conf \
             "${dest}/"

  publish-release:
    needs: [list-rebuilds, build]
    if: ${{ needs.list-rebuilds.outputs.builds != '[]' && needs.list-rebuilds.outputs.builds != '' }}
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.list-rebuilds.outputs.builds) }}
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - name: Check out the bakery repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: compute artefact base name
        id: artefact
        env:
          RELEASE_SPEC: ${{ matrix.release }}
        run: |
          set -euxo pipefail
          extension="${RELEASE_SPEC%%:*}"
          version="${RELEASE_SPEC#*:}"
          echo "base=${extension}-${version}" >> "${GITHUB_OUTPUT}"
          echo "extension=${extension}" >> "${GITHUB_OUTPUT}"

      # gh is needed by the delete step below. Without it, that step's
      # '|| echo' would hide the failure and upload over the old release.
      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq gh

      - name: join arches and tag
        id: build
        env:
          RELEASE_SPEC: ${{ matrix.release }}
          BASE: ${{ steps.artefact.outputs.base }}
        run: |
          set -euxo pipefail
          staging="${SYSEXT_STAGING_ROOT}/${GITHUB_RUN_ID}"
          cp "${staging}/${BASE}-x86-64/"* bakery/
          cp "${staging}/${BASE}-arm64/${BASE}-arm64.raw" bakery/
          cp "${staging}/${BASE}-arm64/${BASE}-arm64-build.log" bakery/
          cp "${staging}/${BASE}-arm64/SHA256SUMS.arm64" bakery/
          pushd bakery
          ./release.sh "${RELEASE_SPEC}" --join

      - name: delete existing GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SPEC: ${{ matrix.release }}
        run: |
          set -euxo pipefail
          spec="${RELEASE_SPEC}"
          tag="${spec%%:*}-${spec#*:}"
          # Both arch builds and the join succeeded. Keep the git tag;
          # release.sh --join already force-updated it.
          gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes \
            || echo "No existing '${tag}' release to delete."

      - name: create a new release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          tag_name: ${{ steps.build.outputs.tag }}
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
            bakery/*.raw
            bakery/*.conf
            bakery/*-build.log

      # Only on success: a failed publish keeps its staging so the job can be
      # re-run. list-rebuilds prunes anything older than three days.
      - name: remove staged artefacts
        env:
          BASE: ${{ steps.artefact.outputs.base }}
        run: |
          set -euxo pipefail
          staging="${SYSEXT_STAGING_ROOT}/${GITHUB_RUN_ID}"
          rm -rf "${staging}/${BASE}-x86-64" "${staging}/${BASE}-arm64"
          rmdir --ignore-fail-on-non-empty "${staging}"

  update-extension-metadata:
    needs: [list-rebuilds, publish-release]
    if: ${{ needs.list-rebuilds.outputs.extensions != '[]' && needs.list-rebuilds.outputs.extensions != '' }}
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJson(needs.list-rebuilds.outputs.extensions) }}
    continue-on-error: true
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq \
            bzip2 \
            curl \
            gh \
            jq \
            unzip \
            yq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: Fetch extension release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euxo pipefail
          pushd bakery
          ./release_meta.sh "${EXTENSION}"

      - name: create new metadata release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          tag_name: ${{ matrix.extension }}
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
            bakery/*.conf

  update-global-metadata:
    needs: [list-rebuilds, update-extension-metadata]
    if: ${{ needs.list-rebuilds.outputs.extensions != '[]' && needs.list-rebuilds.outputs.extensions != '' }}
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch != '' && inputs.branch || 'main' }}
          path: bakery

      - name: install prerequisites
        run: |
          set -euxo pipefail
          sudo apt update -qq && sudo apt install -yqq \
            bzip2 \
            curl \
            gh \
            jq \
            unzip \
            yq \
            squashfs-tools \
            xz-utils \
            erofs-utils

      - name: Fetch all extension releases metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pushd bakery
          ./release_meta.sh

      - name: create new metadata release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          tag_name: SHA256SUMS
          body_path: bakery/Release.md
          files: |
            bakery/SHA256SUMS
